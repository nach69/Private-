<div class="invitacion" id="invitacion-newsletter" role="dialog" aria-modal="false" aria-labelledby="invitacion-titulo" hidden>
    <button type="button" class="invitacion__cerrar" data-invitacion-cerrar aria-label="Cerrar, ahora no">×</button>
    <p class="invitacion__titulo" id="invitacion-titulo">Forma parte de la Sobremesa</p>
    <p class="invitacion__texto">Te avisamos de los próximos planes antes que a nadie.</p>
    <form class="invitacion__form" action="/api/contacto" method="post" novalidate data-formulario data-invitacion>
      <input type="hidden" name="tipo" value="newsletter">
      <input type="hidden" name="origen" value="invitacion">
      <input type="hidden" name="t" value="">
      <div class="invitacion__fila">
        <div class="field">
          <label class="sr-only" for="inv-email">Tu email</label>
          <input id="inv-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Tu email" required maxlength="150">
        </div>
        <button class="btn btn--small" type="submit">Me apunto</button>
      </div>
      <p class="field__error" id="inv-email-error"></p>
      <div class="hp" aria-hidden="true">
        <label for="inv-web">No rellenar</label>
        <input id="inv-web" name="web" type="text" tabindex="-1" autocomplete="off">
      </div>
      <p class="form-status" role="status" aria-live="polite"></p>
      <p class="invitacion__legal"><span data-texto-alta>Al apuntarte recibirás por email los planes y novedades de {{nombre}}. Puedes darte de baja cuando quieras.</span> <a href="/privacidad/">Privacidad</a></p>
    </form>
  </div>
